<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Designs - RoomVision</title>
    <link rel="stylesheet" href="/css/room.css">
    <link rel="stylesheet" href="/css/projects.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <div class="header-left">
                <a class="logo" href="projects.html">
                    <div class="logo-icon" aria-hidden="true">
                        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10 16L24 8L38 16V32L24 40L10 32V16Z" fill="#fff" opacity="0.95"/>
                        </svg>
                    </div>
                    <div class="logo-text">RoomVision</div>
                </a>
            </div>
            <nav class="header-nav">
                <a href="projects.html" class="nav-link"><span>Projects</span></a>
                <a href="manage-designs.html" class="nav-link active"><span>Manage Designs</span></a>
            </nav>
            <div class="header-right">
                <a href="projects.html" class="user-info" title="My Projects">📁 My Projects</a>
            </div>
        </div>
    </header>

    <main class="projects-container">
        <div class="projects-header">
            <h1>Manage Designs</h1>
            <p class="muted">View and manage all your saved room designs. (Coming soon)</p>
        </div>

        <section class="projects-list" id="designsList" aria-live="polite">
            <div class="muted" style="text-align: center; padding: 40px;">
                <p>Your saved designs will appear here.</p>
            </div>
        </section>
    </main>

    <!-- Firebase auth guard -->
    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
