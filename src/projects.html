<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects - RoomVision</title>
    <link rel="stylesheet" href="../css/room.css">
    <link rel="stylesheet" href="../css/projects.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6", 600: "#2563eb", 900: "#1e3a8a" },
                        accent: { 500: "#8b5cf6", 600: "#7c3aed" }
                    }
                }
            }
        }
    </script>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <div class="h-16"></div> <!-- Spacer for fixed nav -->

    <main class="projects-container">
        <!-- Breadcrumb -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <span>Home</span>
            <span class="breadcrumb-separator">›</span>
            <span>Projects</span>
        </nav>

        <div class="projects-header">
            <div class="header-content">
                <h1>Your Projects</h1>
                <p class="page-subtitle">Create a project to group multiple room setups. Click "Open" to start designing
                    rooms.</p>
            </div>
            <div class="projects-actions">
                <button id="createProjectBtn" class="btn-primary">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 5v10M5 10h10" />
                    </svg>
                    <span>New Project</span>
                </button>
            </div>
        </div>

        <section class="projects-section">
            <div class="section-header-inline">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M4 4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V8a2 2 0 00-2-2h-5L9 4H4z" />
                    </svg>
                    All Projects
                </h2>
                <span class="project-count" id="projectCount">0 projects</span>
            </div>

            <div class="projects-list" id="projectsList" aria-live="polite">
                <!-- Loading state -->
                <div class="loading-skeleton">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Create Project Modal -->
    <div id="projectModal" class="modal" hidden role="dialog" aria-labelledby="modalTitle" aria-modal="true">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create New Project</h2>
                <button type="button" class="modal-close" id="modalClose" aria-label="Close modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="projectForm">
                <div class="form-group">
                    <label for="projectTitle" class="form-label">
                        Project Title
                        <span class="required">*</span>
                    </label>
                    <input id="projectTitle" name="title" type="text" class="form-input"
                        placeholder="e.g., My Dream Home" required maxlength="100" aria-required="true">
                    <span class="char-count"><span id="titleCount">0</span>/100</span>
                </div>

                <div class="form-group">
                    <label for="projectDesc" class="form-label">Description</label>
                    <textarea id="projectDesc" name="description" class="form-textarea"
                        placeholder="Describe your project..." rows="4" maxlength="500"></textarea>
                    <span class="char-count"><span id="descCount">0</span>/500</span>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancelCreate" class="btn-secondary">
                        Cancel
                    </button>
                    <button type="submit" class="btn-primary">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M5 10l3 3 7-7" />
                        </svg>
                        <span>Create Project</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="spinner"></div>
        <p>Creating your project...</p>
    </div>
    <script type="module" src="js/projects.js"></script>
    <script type="module" src="js/navbar.js"></script>
</body>

</html>
