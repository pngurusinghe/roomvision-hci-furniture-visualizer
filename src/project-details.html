<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Details - RoomVision</title>
    <link rel="stylesheet" href="../css/room.css">
    <link rel="stylesheet" href="../css/projects.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6", 600: "#2563eb", 900: "#1e3a8a" },
                        accent: { 500: "#8b5cf6", 600: "#7c3aed" }
                    }
                }
            }
        }
    </script>
</head>

<body>
    <nav
        class="fixed top-0 left-0 right-0 h-16 bg-white/90 backdrop-blur-md border-b border-slate-200 z-50 shadow-sm transition-all antialiased">
        <div class="max-w-7xl mx-auto px-6 h-full flex items-center justify-between">
            <div class="flex items-center gap-6">
                <button onclick="window.location.href='home.html'"
                    class="flex items-center gap-2 cursor-pointer border-none bg-transparent hover:opacity-80 transition-opacity focus:outline-none">
                    <div
                        class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-600 to-accent-600 flex items-center justify-center text-white font-bold shadow-md">
                        <svg class="w-5 h-5 drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
                                stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
                        </svg>
                    </div>
                    <span
                        class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-accent-600">RoomVision</span>
                </button>
                <div class="w-px h-6 bg-slate-200"></div>

                <div class="flex items-center gap-1 bg-slate-50 p-1 rounded-lg border border-slate-200 shadow-inner">
                    <a href="projects.html"
                        class="px-3 py-1.5 text-sm font-medium rounded-md text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition-all">Projects</a>
                    <a href="#"
                        class="px-3 py-1.5 text-sm font-semibold rounded-md bg-white text-brand-600 shadow-sm ring-1 ring-slate-200 transition-all"
                        aria-current="page">Project Details</a>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 cursor-pointer group" id="themeToggle">
                    <span
                        class="text-xs font-semibold text-slate-500 group-hover:text-slate-700 transition-colors uppercase tracking-wider">Theme</span>
                    <div
                        class="w-10 h-5 bg-slate-200 border border-slate-300 rounded-full relative transition-colors group-hover:bg-slate-300">
                        <div
                            class="theme-toggle-slider w-4 h-4 bg-white rounded-full absolute top-px left-px shadow transition-transform">
                        </div>
                    </div>
                </div>

                <div class="w-px h-6 bg-slate-200"></div>

                <div class="flex items-center gap-2 flex-row-reverse" id="userInfo">
                    <span class="text-sm font-semibold text-slate-700" id="userName">Loading...</span>
                    <div
                        class="w-8 h-8 flex items-center justify-center bg-slate-100 text-slate-500 rounded-full shadow-sm border border-slate-200">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                </div>

                <button
                    class="px-3 py-1.5 text-sm font-semibold text-rose-500 hover:text-white hover:bg-rose-500 rounded-lg transition-all focus:outline-none focus:ring-2 focus:ring-rose-500/20"
                    id="logoutBtn">
                    Logout
                </button>
            </div>
    </nav>
    <div class="h-16"></div> <!-- Spacer for fixed nav -->

    <main class="project-details-container">
        <!-- Breadcrumb -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="projects.html">Projects</a>
            <span class="breadcrumb-separator">›</span>
            <span id="breadcrumbProjectName">Project Details</span>
        </nav>

        <div class="project-header-card">
            <div class="project-header-content">
                <div class="project-icon">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <rect width="48" height="48" rx="12" fill="url(#projectIconGradient)" />
                        <defs>
                            <linearGradient id="projectIconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <path d="M14 18a2 2 0 00-2 2v8a2 2 0 002 2h20a2 2 0 002-2v-8a2 2 0 00-2-2h-8l-2-2h-10z"
                            fill="white" />
                    </svg>
                </div>
                <div class="project-info">
                    <h1 id="projectTitle">Project Name</h1>
                    <p class="project-meta" id="projectDesc">Project description goes here</p>
                    <div class="project-stats">
                        <span class="stat-item">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M3 3a1 1 0 011-1h8a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V3z" />
                            </svg>
                            <span id="roomCount">0 rooms</span>
                        </span>
                    </div>
                </div>
            </div>
            <div class="project-actions-header">
                <button id="backBtn" class="btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 10H5M5 10l5 5M5 10l5-5" />
                    </svg>
                    <span>Back</span>
                </button>
                <button id="newRoomBtn" class="btn-primary">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 5v10M5 10h10" />
                    </svg>
                    <span>New Room</span>
                </button>
            </div>
        </div>

        <section class="rooms-section">
            <div class="section-header-inline">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z" />
                    </svg>
                    Rooms in this Project
                </h2>
            </div>

            <div class="rooms-grid" id="roomsList" aria-live="polite">
                <!-- Loading state -->
                <div class="loading-skeleton">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="spinner"></div>
        <p>Loading project details...</p>
    </div>

    <!-- Firebase & Auth -->
    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                document.getElementById('userName').textContent = user.displayName || user.email || 'User';
            }
        });

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
        }
    </script>

    <script type="module" src="js/project-details.js"></script>
</body>

</html>
