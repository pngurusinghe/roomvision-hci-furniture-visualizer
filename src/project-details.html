<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Details - RoomVision</title>
    <link rel="stylesheet" href="../css/room.css">
    <link rel="stylesheet" href="../css/projects.css">
</head>

<body>
    <header class="app-header">
        <div class="header-container">
            <div class="header-left">
                <a class="logo" href="projects.html">
                    <div class="logo-icon">
                        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                            <defs>
                                <linearGradient id="logoGradientDetails" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            <rect width="40" height="40" rx="10" fill="url(#logoGradientDetails)" />
                            <path d="M20 12L27 18H24V26H16V18H13L20 12Z" fill="white" />
                            <circle cx="20" cy="32" r="2" fill="white" opacity="0.6" />
                        </svg>
                    </div>
                    <span class="logo-text">RoomVision</span>
                    <span class="stats-badge">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
                            <path d="M6 1l1.5 3 3.5.5-2.5 2.5.5 3.5L6 9l-3 1.5.5-3.5L1 4.5l3.5-.5z" />
                        </svg>
                        Beta
                    </span>
                </a>
            </div>
            <nav class="header-nav">
                <a href="projects.html" class="nav-link"><span>Projects</span></a>
                <a href="#" class="nav-link active"><span>Project Details</span></a>
            </nav>
            <div class="header-right">
                <div class="theme-toggle-wrapper">
                    <span class="theme-label">Theme</span>
                    <div class="theme-toggle" id="themeToggle">
                        <div class="theme-toggle-slider"></div>
                    </div>
                </div>
                <div class="user-info" id="userInfo">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M10 2a8 8 0 100 16 8 8 0 000-16zM7 9a1 1 0 112 0 1 1 0 01-2 0zm7 4a1 1 0 01-1 1H7a1 1 0 010-2h6a1 1 0 011 1z" />
                    </svg>
                    <span id="userName">Loading...</span>
                </div>
            </div>
        </div>
    </header>

    <main class="project-details-container">
        <!-- Breadcrumb -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="projects.html">Projects</a>
            <span class="breadcrumb-separator">›</span>
            <span id="breadcrumbProjectName">Project Details</span>
        </nav>

        <div class="project-header-card">
            <div class="project-header-content">
                <div class="project-icon">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <rect width="48" height="48" rx="12" fill="url(#projectIconGradient)" />
                        <defs>
                            <linearGradient id="projectIconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <path d="M14 18a2 2 0 00-2 2v8a2 2 0 002 2h20a2 2 0 002-2v-8a2 2 0 00-2-2h-8l-2-2h-10z"
                            fill="white" />
                    </svg>
                </div>
                <div class="project-info">
                    <h1 id="projectTitle">Project Name</h1>
                    <p class="project-meta" id="projectDesc">Project description goes here</p>
                    <div class="project-stats">
                        <span class="stat-item">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M3 3a1 1 0 011-1h8a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V3z" />
                            </svg>
                            <span id="roomCount">0 rooms</span>
                        </span>
                    </div>
                </div>
            </div>
            <div class="project-actions-header">
                <button id="backBtn" class="btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 10H5M5 10l5 5M5 10l5-5" />
                    </svg>
                    <span>Back</span>
                </button>
                <button id="newRoomBtn" class="btn-primary">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 5v10M5 10h10" />
                    </svg>
                    <span>New Room</span>
                </button>
            </div>
        </div>

        <section class="rooms-section">
            <div class="section-header-inline">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z" />
                    </svg>
                    Rooms in this Project
                </h2>
            </div>

            <div class="rooms-grid" id="roomsList" aria-live="polite">
                <!-- Loading state -->
                <div class="loading-skeleton">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="spinner"></div>
        <p>Loading project details...</p>
    </div>

    <!-- Firebase & Auth -->
    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                document.getElementById('userName').textContent = user.displayName || user.email || 'User';
            }
        });

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
        }
    </script>

    <script type="module" src="js/project-details.js"></script>
</body>

</html>
