<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Details - RoomVision</title>
    <link rel="stylesheet" href="../css/room.css">
    <link rel="stylesheet" href="../css/projects.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6", 600: "#2563eb", 900: "#1e3a8a" },
                        accent: { 500: "#8b5cf6", 600: "#7c3aed" }
                    }
                }
            }
        }
    </script>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <div class="h-16"></div> <!-- Spacer for fixed nav -->

    <main class="project-details-container">


        <div class="project-header-card">
            <div class="project-header-content">
                <div class="project-icon">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <rect width="48" height="48" rx="12" fill="url(#projectIconGradient)" />
                        <defs>
                            <linearGradient id="projectIconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <path d="M14 18a2 2 0 00-2 2v8a2 2 0 002 2h20a2 2 0 002-2v-8a2 2 0 00-2-2h-8l-2-2h-10z"
                            fill="white" />
                    </svg>
                </div>
                <div class="project-info">
                    <h1 id="projectTitle">Project Name</h1>
                    <p class="project-meta" id="projectDesc">Project description goes here</p>
                    <div class="project-stats">
                        <span class="stat-item">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M3 3a1 1 0 011-1h8a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V3z" />
                            </svg>
                            <span id="roomCount">0 rooms</span>
                        </span>
                    </div>
                </div>
            </div>
            <div class="project-actions-header">
                <button id="backBtn" class="btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 10H5M5 10l5 5M5 10l5-5" />
                    </svg>
                    <span>Back</span>
                </button>
                <button id="newRoomBtn" class="btn-primary">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 5v10M5 10h10" />
                    </svg>
                    <span>New Room</span>
                </button>
            </div>
        </div>

        <section class="rooms-section">
            <div class="section-header-inline">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z" />
                    </svg>
                    Rooms in this Project
                </h2>
            </div>

            <div class="rooms-grid" id="roomsList" aria-live="polite">
                <!-- Loading state -->
                <div class="loading-skeleton">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="spinner"></div>
        <p>Loading project details...</p>
    </div>

    <!-- Konva for 2D Canvas Previews -->
    <script src="https://unpkg.com/konva@9.2.3/konva.min.js"></script>

    <script type="module" src="js/project-details.js"></script>
    <script type="module" src="js/navbar.js"></script>
</body>

</html>
